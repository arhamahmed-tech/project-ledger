name: Project Ledger

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate ledger (hard gate)
        run: |
          if [ -f scripts/ledger.mjs ]; then
            node scripts/ledger.mjs validate
          elif [ -f node_modules/project-ledger/bin/project-ledger.js ]; then
            node node_modules/project-ledger/bin/project-ledger.js validate
          else
            echo "::error::No ledger CLI — run project-ledger init and commit scripts/ledger.mjs"
            exit 1
          fi
      - name: Diff check TASK/CHG coverage (PR)
        if: github.event_name == 'pull_request'
        env:
          LEDGER_DIFF_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f scripts/ledger.mjs ]; then
            node scripts/ledger.mjs check
          else
            node node_modules/project-ledger/bin/project-ledger.js check
          fi
      - name: Diff check TASK/CHG coverage (push)
        if: github.event_name == 'push'
        run: |
          # Compare against previous commit when available
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            export LEDGER_DIFF_RANGE="${{ github.event.before }}...${{ github.sha }}"
          fi
          if [ -f scripts/ledger.mjs ]; then
            node scripts/ledger.mjs check
          else
            node node_modules/project-ledger/bin/project-ledger.js check
          fi
