name: Project Ledger

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate ledger
        run: |
          if [ -f scripts/ledger.mjs ]; then
            node scripts/ledger.mjs validate
          elif [ -f node_modules/project-ledger/bin/project-ledger.js ]; then
            node node_modules/project-ledger/bin/project-ledger.js validate
          else
            echo "No ledger CLI in repo — skip (run project-ledger init)"
            exit 0
          fi
      - name: Diff check (TASK/CHG coverage)
        if: github.event_name == 'pull_request'
        env:
          LEDGER_DIFF_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f scripts/ledger.mjs ]; then
            node scripts/ledger.mjs check
          fi
