# Project Ledger data model (V0.5)
entities:
  - PROJECT
  - PERSON
  - EPIC
  - MILESTONE
  - REQUIREMENT
  - SOW
  - SOW_REVISION
  - SPEC
  - SPEC_REVISION
  - DECISION
  - PLAN
  - TASK
  - AGENT_RUN
  - CHANGE
  - EVIDENCE
  - TEST
  - RELEASE
  - EVENT

chain:
  - EPIC
  - MILESTONE
  - SOW
  - SOW_REVISION
  - REQUIREMENT
  - SPEC
  - SPEC_REVISION
  - DECISION
  - PLAN
  - TASK
  - AGENT_RUN
  - CHANGE
  - COMMIT_OR_PR
  - EVIDENCE
  - RELEASE

conventions:
  human_readable: docs/
  machine_history: .engineering/
  audit: .audit/events.jsonl
  agent_attribution: .agent-trace/
  active_context: .project/context.yaml
  specs: ProductSpec-compatible markdown under docs/product/specs/<SPEC-ID>/v<N>.md
  product_sources: user-provided originals under docs/product/sources/{sow,specs,briefs,misc}/ — do not rewrite; derive formal SOW/SPEC from them
  milestones: docs/plans/milestones/MS-*.md
  decisions: immutable ADRs; supersede via new ADR, never rewrite
  events: append-only JSONL
  tests: .engineering/tests
  releases: .engineering/releases
  templates: .project/templates
  security: agents must run security/code review on sensitive changes
  style: agents must follow docs/conventions/code-style.md and .project/conventions.yaml (naming e.g. camelCase; match adjacent files)
  preflight: run ledger preflight before coding; ledger done enforces runs/evidence/tests rules
